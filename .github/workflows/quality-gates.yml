name: Quality gates

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories and CodeQL queries apply without a code change.
    - cron: '23 4 * * 1'
  workflow_dispatch:

# Read-only by default; only the CodeQL job may upload results.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run unit tests (Node's built-in test runner, no dependencies)
        run: npm run test:unit

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the Chromium build pinned by package-lock.json
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (Desktop and Mobile Chrome)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  dependency-audit:
    name: 'Security: dependency audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without running their install scripts
        run: npm ci --ignore-scripts
      - name: Fail on known high or critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures

  dependency-review:
    name: 'Security: dependency review'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Block pull requests that add vulnerable dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    name: 'Security: CodeQL'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
